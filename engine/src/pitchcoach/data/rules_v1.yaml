# 진단 규칙 v1: 문제 -> 가능한 원인 -> 30초 자가 테스트 -> 운동 제안.
# 근거 기준: 각 연결(링크)마다 PubMed에서 초록을 직접 확인한 문헌을 붙인다.
#   cause_source : 원인-문제(또는 구속) 연관 문헌 (JSON으로 내보내지 않는 추적용 필드)
#   self_test.source : 자가 테스트가 해당 능력을 재는 방식으로 쓰인 문헌
#   exercise.source : 운동/프로그램이 그 능력 또는 투구(던지기) 수행을 향상시킨 문헌
# 연관(상관) 수준의 근거는 인과가 아니며, 대상(청소년·타 종목)이 다르면 description에 적었다.
# sets_reps: 초록에 프로토콜이 있을 때만 쓰고, 없으면 "출처의 프로토콜 참고".
# 자가 테스트는 연구의 측정을 집에서 할 수 있게 단순화한 간이 버전이며 진단이 아니다.
# 문헌이 연결을 지지하지 않는 원인은 넣지 않았다(일부 issue는 causes가 비어 있음). 이 앱은 의료 진단이 아니다. 통증이 있으면 운동을 멈추고 전문가와 상담한다.
defs:
  src_sakata: &src_sakata >-
    Sakata J, et al. (2019). Throwing Injuries in Youth Baseball Players: Can a Prevention Program
    Help? A Randomized Controlled Trial. Am J Sports Med 47(11):2709-2716.
    PMID 31336051, DOI 10.1177/0363546519861378.
  src_kim: &src_kim >-
    Kim, et al. (2024). Comparison of the Effects of Compound Training, Plyometric Exercises, and Kettlebell
    Exercises on Strength, Power, Dynamic Balance, and Pitched Ball Velocity in 30 Male High School
    Baseball Pitchers Aged 16-19 Years. Med Sci Monit 30:e944623.
    PMID 39118306, DOI 10.12659/MSM.944623.
  src_lin: &src_lin >-
    Lin, et al. (2024). Enhancing Overhead Throwing Ball Velocity After Core Muscle Training in Athletes: A
    Systematic Review and Meta-analysis of Randomized Controlled Trials. Am J Phys Med Rehabil
    103(10):897-903. PMID 38529609, DOI 10.1097/PHM.0000000000002469.
  src_raeder: &src_raeder >-
    Raeder C, et al. (2015). Effects of Six Weeks of Medicine Ball Training on Throwing Velocity,
    Throwing Precision, and Isokinetic Strength of Shoulder Rotators in Female Handball Players.
    J Strength Cond Res 29(7):1904-1914. PMID 26102258, DOI 10.1519/JSC.0000000000000847.
  src_fry: &src_fry >-
    Fry KE, et al. (2017). Youth Baseball Pitching Stride Length: Normal Values and Correlation With
    Field Testing. Sports Health 9(3):205-209. PMID 27864504, DOI 10.1177/1941738116679815.
  src_marsh: &src_marsh >-
    Marsh, et al. (2004). The relationship between balance and pitching error in college baseball pitchers.
    J Strength Cond Res 18(3):441-446. PMID 15320675, DOI 10.1519/R-13433.1.
  src_hsiao: &src_hsiao >-
    Hsiao, et al. (2026). Countermovement Jump Analysis as a Predictor of Overhead Pitching Velocity in
    Adolescent Baseball Pitchers. J Hum Kinet 102:23-34. PMID 42211802, DOI 10.5114/jhk/211720.
  src_king: &src_king >-
    King BW, et al. (2025). Peak Lower-Extremity Power Unadjusted for Body Mass Predicts Fastball
    Velocity in Collegiate Baseball Pitchers. J Strength Cond Res 39(2):217-226.
    PMID 39446825, DOI 10.1519/JSC.0000000000004966.
  src_yanagisawa: &src_yanagisawa >-
    Yanagisawa O, et al. (2019). Functional Hip Characteristics and Their Relationship With Ball
    Velocity in College Baseball Pitchers. J Sport Rehabil 28(8):854-859.
    PMID 30300068, DOI 10.1123/jsr.2018-0122.
  src_eilen: &src_eilen >-
    Eilen, et al. (2024). Relationship of Abdominal Oblique Strength on Biomechanics in Adolescent Baseball
    Pitchers. J Athl Train 60(6):445-451. PMID 39480789, DOI 10.4085/1062-6050-0195.24.
  src_cohen: &src_cohen >-
    Cohen, et al. (2019). The Association Among Trunk Rotation, Ball Velocity, and the Elbow Varus Moment in
    Collegiate-Level Baseball Pitchers. Am J Sports Med 47(12):2816-2820.
    PMID 31424975, DOI 10.1177/0363546519867934.
  src_taniyama: &src_taniyama >-
    Taniyama D, et al. (2021). Rotational Medicine Ball Throw Velocity Relates to NCAA Division III
    College Baseball Player Bat Swing, Batted Baseball, and Pitching Velocity. J Strength Cond Res
    35(12):3414-3419. PMID 34570055, DOI 10.1519/JSC.0000000000004148.
  src_oyama: &src_oyama >-
    Oyama S, et al. (2017). Trunk Muscle Function Deficit in Youth Baseball Pitchers With Excessive
    Contralateral Trunk Tilt During Pitching. Clin J Sport Med 27(5):475-480.
    PMID 27753641, DOI 10.1097/JSM.0000000000000396.
  src_johnson: &src_johnson >-
    Johnson AL, et al. (2025). Assessment of Muscular Fatigue on Hip and Torso Biomechanics in
    Adolescent Baseball Pitchers. J Strength Cond Res 39(8):893-899.
    PMID 40440541, DOI 10.1519/JSC.0000000000005136.

  # ---- 운동 ----
  ex_lower_body: &ex_lower_body
    id: ex_lower_body_combined
    name: 하체 복합 훈련 (플라이오메트릭 + 케틀벨 등)
    sets_reps: 출처의 프로토콜 참고 (연구에서는 주 2회, 4주)
    description: >-
      고교 투수 30명을 복합 훈련, 플라이오메트릭, 케틀벨 3그룹으로 나눠 주 2회 4주 시행한 무작위 연구입니다.
      세 그룹 모두 근력, 수직점프, 동적 균형(Y-balance), 투구 속도가 증가했고 복합 훈련 그룹의 향상이 더
      컸습니다. 시즌 중 4주 연구이며 구체적 종목과 세트·횟수는 논문을 확인하세요.
    source: *src_kim
  ex_core: &ex_core
    id: ex_core_training
    name: 코어 근육 훈련
    sets_reps: 출처의 프로토콜 참고
    description: >-
      오버헤드 던지기 선수 대상 무작위 대조 연구 10편의 메타분석에서 코어 훈련 후 서서 던지기 속도가
      유의하게 증가했고, 훈련 기간이 길고 주당 빈도가 높을수록 효과가 컸습니다. 스텝·점프 던지기에서는 효과가
      불확실했습니다. 연구마다 종목과 운동 구성이 달라 구체적 동작은 논문을 확인하세요.
    source: *src_lin
  ex_med_ball: &ex_med_ball
    id: ex_medicine_ball
    name: 메디신볼 회전 던지기 훈련
    sets_reps: 출처의 프로토콜 참고 (연구에서는 주 3회, 6주)
    description: >-
      여자 핸드볼 선수 28명 무작위 연구에서 6주 메디신볼 훈련 그룹의 던지기 속도가 대조군보다 더 크게
      증가했고(약 14% 대 3.7%) 어깨 내회전 근력도 증가했습니다. 대상이 야구가 아닌 핸드볼 선수이며 세트·횟수는
      논문을 확인하세요.
    source: *src_raeder
  ex_warmup: &ex_warmup
    id: ex_warmup_mobility_balance
    name: 스트레칭 · 동적 가동성 · 균형 워밍업
    sets_reps: 출처의 프로토콜 참고
    description: >-
      청소년 야구 선수 237명 무작위 대조 연구의 워밍업 프로그램(스트레칭 5종, 동적 가동성 2종, 균형 훈련
      2종)입니다. 어깨·팔꿈치 부상 발생률이 낮아졌고 구속 지표도 증가 경향을 보였습니다. 초록에는 균형 개선 결과가 보고되지 않았습니다. 9~11세 대상이라
      성인에게 같은 효과가 있다는 근거는 아닙니다. 구체적 동작은 논문을 확인하세요.
    source: *src_sakata

  # ---- 자가 테스트 ----
  st_single_leg: &st_single_leg
    id: st_single_leg_stance
    instruction: >-
      맨발로 한 발로 서서 두 손을 허리에 얹고 최대 30초 버팁니다. 양발 모두 해 보세요. 한쪽 발로 30초를
      버티지 못하거나 몸이 크게 흔들리는 쪽이 있는지 봅니다. (30초 기준은 이 앱의 간이 기준입니다.)
    options:
      - {id: stable, label: 양발 모두 30초 동안 안정적으로 버틴다}
      - {id: wobble, label: 버티지 못하거나 크게 흔들리는 쪽이 있다}
    implies_cause_on: wobble
    source: >-
      연구들이 한 발 서기를 균형 측정으로 쓴 방식을 간이화함. Fry KE, et al. (2017). Sports Health
      9(3):205-209. PMID 27864504, DOI 10.1177/1941738116679815 (단일 다리 서기 시간 측정);
      Marsh, et al. (2004). J Strength Cond Res 18(3):441-446. PMID 15320675, DOI 10.1519/R-13433.1
      (지배 다리 한 발 서기 흔들림 측정). 측정 방식의 출처이며 균형-구속 관계의 근거로 쓰지 않음.
  st_jump: &st_jump
    id: st_vertical_jump
    instruction: >-
      벽 옆에 서서 제자리에서 두 발로 3번 힘껏 뛰어 가장 높이 닿은 위치를 표시하고 기록하세요. 본인의 이전
      기록이나 같은 연령 팀 동료와 비교합니다. 기준 수치는 없으며 상대 비교용입니다. 연구에서는 점프 높이 자체보다
      힘판으로 잰 절대 출력이 더 관련 있었습니다(대학 투수). 참고용 간이 테스트입니다.
    options:
      - {id: ok, label: 이전 기록이나 동료와 비슷하거나 더 높다}
      - {id: low, label: 이전 기록이나 동료보다 눈에 띄게 낮거나 뛰기가 힘겹다}
    implies_cause_on: low
    source: >-
      연구들이 카운터무브먼트/수직 점프를 하체 파워 측정으로 쓴 방식을 간이화함. Hsiao (2026).
      J Hum Kinet 102:23-34. PMID 42211802, DOI 10.5114/jhk/211720; King BW, et al. (2025).
      J Strength Cond Res 39(2):217-226. PMID 39446825, DOI 10.1519/JSC.0000000000004966; Fry KE,
      et al. (2017). Sports Health 9(3):205-209. PMID 27864504, DOI 10.1177/1941738116679815.
  st_rot_throw: &st_rot_throw
    id: st_rotational_throw_lr
    instruction: >-
      대략적인 주관 점검입니다(연구의 측정을 재현하지 않습니다). 메디신볼(없으면 건너뜁니다)을 가볍게 두 손으로
      잡고 벽을 향해 옆으로 서서 왼쪽, 오른쪽 방향으로 각각 3번씩 회전해 던져 보고, 어느 쪽이 눈에 띄게 약하게
      느껴지는지 확인하세요. 통증이 있으면 즉시 멈춥니다.
    options:
      - {id: even, label: 좌우가 비슷하고 힘이 충분하다고 느낀다}
      - {id: weak, label: 한쪽 방향이 확실히 약하거나 전체적으로 힘이 약하다고 느낀다}
    implies_cause_on: weak
    source: >-
      회전 동작 힘을 보는 주관적 점검으로, 연구 측정과 동등하지 않음. 관련 측정: Taniyama D, et al.
      (2021). J Strength Cond Res 35(12):3414-3419. PMID 34570055, DOI 10.1519/JSC.0000000000004148
      (회전 메디신볼 던지기 속도를 전신 파워 지표로 측정); Oyama S, et al. (2017). Clin J Sport Med
      27(5):475-480. PMID 27753641, DOI 10.1097/JSM.0000000000000396 (근력계로 몸통 회전 근력 좌우
      비대칭 측정).
  st_fatigue_sequence: &st_fatigue_sequence
    id: st_early_vs_late_sequence
    instruction: >-
      같은 날 한 세션에서 처음 5구와 마지막 5구를 같은 각도로 촬영해 앱에서 따로 분석하고, 같은 문제
      표시가 뒤쪽 투구에서 더 두드러지는지 비교하세요.
    options:
      - {id: same, label: 처음과 마지막이 비슷하다}
      - {id: later_worse, label: 뒤쪽 투구에서 더 심해진다}
    implies_cause_on: later_worse
    source: >-
      연구는 단일 세션의 처음 5구와 마지막 5구를 비교했고(평균 약 35구), 투구 수 증가에 따라 엉덩관절 근력,
      몸통 회전각, 신체 분리각, 골반 회전 속도, 어깨 내회전 최고속도 시점의 변화를 보고함.
      Johnson AL, et al. (2025). J Strength Cond Res 39(8):893-899. PMID 40440541,
      DOI 10.1519/JSC.0000000000005136.

  # ---- 원인-문제 연관 근거 (추적용, JSON으로 내보내지 않음) ----
  cs_balance: &cs_balance >-
    청소년 투수에서 보폭이 한 발 균형(단일 다리 서기 시간)과 연관(r=0.28)됨(Fry 2017, PMID 27864504).
    Marsh 2004(PMID 15320675)는 흔들림이 큰 쪽이 구속이 더 높았다고 보고해 균형-구속 근거로 쓰지 않음.
  cs_lower_stride: &cs_lower_stride >-
    청소년 투수에서 보폭이 수직점프와 연관(r=0.38)됨(Fry 2017, PMID 27864504).
  cs_lower_velocity: &cs_lower_velocity >-
    하체 파워/근력이 구속과 연관됨: 대학 D1 투수 CMJ 절대 출력(King 2025, PMID 39446825), 청소년 투수 CMJ
    (Hsiao 2026, PMID 42211802), 대학 투수 양다리 엉덩관절 근력(Yanagisawa 2019, PMID 30300068).
  cs_trunk: &cs_trunk >-
    복사근 근력이 골반·몸통 회전 최고속도와 연관(Eilen 2024, PMID 39480789, 청소년); 몸통 최대 회전속도가 구속과
    연관(Cohen 2019, PMID 31424975, 대학 투수); 회전 메디신볼 던지기 속도가 구속과 연관(Taniyama 2021,
    PMID 34570055, r=0.62).
  cs_fatigue_seq: &cs_fatigue_seq >-
    단일 세션 투구 수 증가에 따라 신체 분리각, 골반 회전 속도, 어깨 내회전 최고속도 시점 등이 변함
    (Johnson 2025, PMID 40440541, 청소년).

issues:
  - id: stride_short
    title: 보폭이 짧습니다
    when:
      any:
        - {metric: stride_length_pct_height, z_lt: -1.0}
    evidence_template: 착지 시 보폭이 키의 {value}{unit}로, 기준 대비 z={z}입니다.
    causes:
      - id: stance_balance
        title: 한 발 균형 부족 (청소년 투수에서 보폭과 연관이 보고됨)
        cause_source: *cs_balance
        self_test: *st_single_leg
        exercises: [*ex_warmup, *ex_lower_body]
      - id: lower_body_power
        title: 하체 파워 부족 (청소년 투수에서 보폭과 연관이 보고됨)
        cause_source: *cs_lower_stride
        self_test: *st_jump
        exercises: [*ex_lower_body]

  - id: lead_knee_weak
    title: 앞다리 블록이 약합니다
    when:
      any:
        - {metric: lead_knee_extension_deg, z_lt: -1.0}
    evidence_template: 착지 후 앞무릎 펴짐이 {value}{unit}로, 기준 대비 z={z}입니다.
    causes:
      - id: lower_body_power
        title: 하체 파워·근력 부족 (구속과 연관이 보고됨)
        cause_source: *cs_lower_velocity
        self_test: *st_jump
        exercises: [*ex_lower_body]

  - id: pelvis_shoulder_order
    title: 골반에서 어깨로 에너지가 순서대로 전달되지 않습니다
    when:
      any:
        - {leak_segment: legs, leak_kind: out_of_order}
        - {metric: gap_pelvis_shoulder_ms, abs_z_gt: 2.0}
    evidence_template: 골반→어깨 최고속도 간격이 {value}{unit}로, 기준 대비 z={z}입니다.
    causes:
      - id: fatigue
        title: 투구 수 증가에 따른 피로 (신체 분리각·골반 회전 속도 변화와 연관이 보고됨)
        cause_source: *cs_fatigue_seq
        self_test: *st_fatigue_sequence
        exercises: []

  - id: trunk_speed_loss
    title: 몸통에서 속도가 줄어듭니다
    when:
      any:
        - {leak_segment: trunk, leak_kind: speed_drop}
        - {metric: shoulder_peak_speed_ms, z_lt: -1.5}
        - {metric: trunk_flexion_peak_vel_dps, z_lt: -1.5}
    evidence_template: 몸통 속도 지표가 {value}{unit}로, 기준 대비 z={z}입니다.
    causes:
      - id: trunk_rotation_strength
        title: 몸통 회전 근력·파워 부족 (몸통 회전속도·구속과 연관이 보고됨)
        cause_source: *cs_trunk
        self_test: *st_rot_throw
        exercises: [*ex_core, *ex_med_ball]

  - id: elbow_wrist_order
    title: 팔꿈치에서 손목으로 순서가 어긋납니다
    when:
      any:
        - {leak_segment: arm, leak_kind: out_of_order}
        - {metric: gap_elbow_wrist_ms, abs_z_gt: 2.0}
    evidence_template: 팔꿈치→손목 최고속도 간격이 {value}{unit}로, 기준 대비 z={z}입니다.
    causes: []

  - id: arm_speed_loss
    title: 팔에서 속도가 줄어듭니다
    when:
      any:
        - {leak_segment: arm, leak_kind: speed_drop}
        - {metric: wrist_peak_speed_ms, z_lt: -1.5}
