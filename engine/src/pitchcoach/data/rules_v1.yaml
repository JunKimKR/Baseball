# 진단 규칙 v1: 문제 -> 가능한 원인 -> 30초 자가 테스트 -> 운동 제안.
# 모든 운동/자가 테스트의 source는 PubMed에서 메타데이터를 직접 확인한 문헌이다.
# 출처가 운동 세트/횟수를 제공하지 않으므로 sets_reps는 "출처의 프로토콜 참고"로 둔다(수치를 지어내지 않음).
# 자가 테스트는 연구의 측정 방식을 집에서 할 수 있게 단순화한 간이 버전이며, 진단이 아니다.
# 원인-문헌 연결은 상관/연관 수준이며 인과가 아니다. 문헌이 연결을 지지하지 않는 원인은 넣지 않았다
# (그래서 일부 issue는 causes가 비어 있다). 이 앱은 의료 진단이 아니다. 통증이 있으면 운동을 멈추고 전문가와 상담한다.
defs:
  src_sakata: &src_sakata >-
    Sakata J, et al. (2019). Throwing Injuries in Youth Baseball Players: Can a Prevention Program
    Help? A Randomized Controlled Trial. Am J Sports Med 47(11):2709-2716.
    PMID 31336051, DOI 10.1177/0363546519861378.

  ex_warmup: &ex_warmup
    id: ex_warmup_mobility_balance
    name: 스트레칭 · 동적 가동성 · 균형 워밍업
    sets_reps: 출처의 프로토콜 참고
    description: >-
      청소년 야구 선수 237명 대상 무작위 대조 연구에서 쓴 워밍업 프로그램(스트레칭 5종, 동적 가동성 2종,
      균형 훈련 2종)입니다. 이 연구에서 어깨·팔꿈치 부상 발생률이 낮아졌고 비지배측 엉덩관절 내회전과
      흉추 후만각이 개선됐습니다. 대상이 9~11세 선수이므로 성인에게 같은 효과가 있다는 근거는 아닙니다.
      보폭에 미치는 효과는 이 연구에서 검증되지 않았습니다. 구체적인 동작과 방법은 출처 논문을 확인하세요.
    source: *src_sakata
  st_single_leg_stride: &st_single_leg_stride
    id: st_single_leg_stance
    instruction: >-
      맨발로 한 발로 서서 두 손을 허리에 얹고 최대 30초 버팁니다. 양발 모두 해 보세요. 한쪽 발로 30초를
      버티지 못하거나 몸이 크게 흔들리는 쪽이 있는지 봅니다. (30초 기준은 이 앱의 간이 기준입니다.)
    options:
      - {id: stable, label: 양발 모두 30초 동안 안정적으로 버틴다}
      - {id: wobble, label: 버티지 못하거나 크게 흔들리는 쪽이 있다}
    implies_cause_on: wobble
    source: >-
      연구에서 단일 다리 서기 시간(single-leg stance time)을 측정한 방식을 간이화함. 청소년 투수에서 보폭과
      한 발 균형이 연관(r=0.28)됨. Fry KE, et al. (2017). Youth Baseball Pitching Stride Length: Normal
      Values and Correlation With Field Testing. Sports Health 9(3):205-209. PMID 27864504,
      DOI 10.1177/1941738116679815.
  st_fatigue_stride: &st_fatigue_stride
    id: st_early_vs_late_throws
    instruction: >-
      같은 날 한 세션에서 처음 5구와 마지막 5구를 같은 각도로 촬영해, 앞발이 닿는 위치(보폭)를 비교하세요.
    options:
      - {id: same, label: 처음과 마지막의 보폭이 비슷하다}
      - {id: later_shorter, label: 뒤로 갈수록 보폭이 눈에 띄게 짧아진다}
    implies_cause_on: later_shorter
    source: >-
      연구는 투구 중 피로 부하에 대응해 보폭이 짧아질 수 있다고 보고함(보폭 +-25% 조건 비교).
      Crotin RL, et al. (2014). Altered stride length in response to increasing exertion among baseball
      pitchers. Med Sci Sports Exerc 46(3):565-571. PMID 23917472, DOI 10.1249/MSS.0b013e3182a79cd9.
  st_fatigue_sequence: &st_fatigue_sequence
    id: st_early_vs_late_sequence
    instruction: >-
      같은 날 한 세션에서 처음 5구와 마지막 5구를 같은 각도로 촬영해 앱에서 따로 분석하고, 같은 문제
      표시가 뒤쪽 투구에서 더 두드러지는지 비교하세요.
    options:
      - {id: same, label: 처음과 마지막이 비슷하다}
      - {id: later_worse, label: 뒤쪽 투구에서 더 심해진다}
    implies_cause_on: later_worse
    source: >-
      연구는 단일 세션의 처음 5구와 마지막 5구를 비교했고(평균 약 35구), 투구 수 증가에 따라 엉덩관절·복사근
      근력, 몸통 회전각, 신체 분리각(body separation angle), 골반 회전 속도 관련 변화를 보고함.
      Johnson AL, et al. (2025). Assessment of Muscular Fatigue on Hip and Torso Biomechanics in
      Adolescent Baseball Pitchers. J Strength Cond Res 39(8):893-899. PMID 40440541,
      DOI 10.1519/JSC.0000000000005136.

issues:
  - id: stride_short
    title: 보폭이 짧습니다
    when:
      any:
        - {metric: stride_length_pct_height, z_lt: -1.0}
    evidence_template: 착지 시 보폭이 키의 {value}{unit}로, 기준 대비 z={z}입니다.
    causes:
      - id: stance_balance
        title: 한 발 균형 부족 (청소년 투수에서 보폭과 연관이 보고됨)
        self_test: *st_single_leg_stride
        exercises:
          - *ex_warmup
      - id: fatigue
        title: 투구 수 증가에 따른 피로 (보폭이 짧아지는 반응과 연관이 보고됨)
        self_test: *st_fatigue_stride
        exercises: []

  # 앞다리 블록: 앞무릎 펴짐과 구속의 연관(Dowling 2024)은 보고됐지만, 원인(가동성/균형/근력)과 앞무릎 펴짐을
  # 잇는 검증된 문헌을 찾지 못해 원인을 넣지 않는다(출처 없는 항목은 넣지 않는다).
  - id: lead_knee_weak
    title: 앞다리 블록이 약합니다
    when:
      any:
        - {metric: lead_knee_extension_deg, z_lt: -1.0}
    evidence_template: 착지 후 앞무릎 펴짐이 {value}{unit}로, 기준 대비 z={z}입니다.
    causes: []

  - id: pelvis_shoulder_order
    title: 골반에서 어깨로 에너지가 순서대로 전달되지 않습니다
    when:
      any:
        - {leak_segment: legs, leak_kind: out_of_order}
        - {metric: gap_pelvis_shoulder_ms, abs_z_gt: 2.0}
    evidence_template: 골반→어깨 최고속도 간격이 {value}{unit}로, 기준 대비 z={z}입니다.
    causes:
      - id: fatigue
        title: 투구 수 증가에 따른 피로 (신체 분리각·골반 회전 속도 변화와 연관이 보고됨)
        self_test: *st_fatigue_sequence
        exercises: []

  - id: trunk_speed_loss
    title: 몸통에서 속도가 줄어듭니다
    when:
      any:
        - {leak_segment: trunk, leak_kind: speed_drop}
        - {metric: shoulder_peak_speed_ms, z_lt: -1.5}
        - {metric: trunk_flexion_peak_vel_dps, z_lt: -1.5}
    evidence_template: 몸통 속도 지표가 {value}{unit}로, 기준 대비 z={z}입니다.
    causes: []

  - id: elbow_wrist_order
    title: 팔꿈치에서 손목으로 순서가 어긋납니다
    when:
      any:
        - {leak_segment: arm, leak_kind: out_of_order}
        - {metric: gap_elbow_wrist_ms, abs_z_gt: 2.0}
    evidence_template: 팔꿈치→손목 최고속도 간격이 {value}{unit}로, 기준 대비 z={z}입니다.
    causes: []

  - id: arm_speed_loss
    title: 팔에서 속도가 줄어듭니다
    when:
      any:
        - {leak_segment: arm, leak_kind: speed_drop}
        - {metric: wrist_peak_speed_ms, z_lt: -1.5}
    evidence_template: 손목 최고 속도가 {value}{unit}로, 기준 대비 z={z}입니다.
    causes: []
